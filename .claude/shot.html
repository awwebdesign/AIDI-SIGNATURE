<!doctype html><html><head><style>html,body{margin:0;overflow:hidden}iframe{border:0;display:block}</style></head><body>
<script>
var q=new URLSearchParams(location.search);var w=+q.get('w')||1440,h=+q.get('h')||900;
var f=document.createElement('iframe');f.width=w;f.height=h;f.src=q.get('src')||'/index.html';document.body.appendChild(f);
f.onload=function(){var win=f.contentWindow;setTimeout(function(){var y=q.get('y')||'0';var px=/vh$/.test(y)?parseFloat(y)*h/100:(y.charAt(0)==='#'?win.document.querySelector(y).getBoundingClientRect().top+win.scrollY:+y);
if(win.aidiLenis){win.aidiLenis.scrollTo(px,{immediate:true});}win.scrollTo(0,px);win.dispatchEvent(new Event('scroll'));
var a=q.get('act');if(a)setTimeout(function(){try{(new win.Function(a))()}catch(e){}},300);},+q.get('wait')||2600);};
</script></body></html>
